name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Pin the interpreter: without it uv picks the newest Python allowed by
      # requires-python (>=3.12), which may not have binary wheels yet for
      # pillow/numpy/scipy (Python 3.15 forced a failing source build).
      UV_PYTHON: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install $UV_PYTHON

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Check import contracts
        run: uv run lint-imports

      - name: Check requirements.txt
        run: scripts/check_requirements.sh

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate specs
        run: npx --yes @fission-ai/openspec@1.16.0 validate --all --strict --no-interactive
        env:
          OPENSPEC_TELEMETRY: "0"

      - name: Run tests
        run: uv run pytest
