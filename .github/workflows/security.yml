name: Security audit

# New advisories appear without any change here, and the pre-commit audit only
# runs when the dependencies change.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Audit dependencies
        run: scripts/check_audit.sh
