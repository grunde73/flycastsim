#
# Data set: rod bend data butt-angle = 0.0 deg.
# Rod: T&T Paradigm 9' #5 (3 pc. modell)
# 
# Data treatment confguration data for this dataset.
# This includes the name of the directory with the raw
# data (relative to the current directory), the name
# of the first and last image. 
# A list of image names which could be used to create an image average
# for subtraction.
#
# All directories are relativ to the current dir.
#
---
data_set: rod_bend_butt_00_0
rod: "Sage XP 9' #5 (XP 590-4 custom)"
raw_data_dir: raw_images
first_file: image_0000.jpg
last_file: image_0024.jpg
t0_frame: image_0000.jpg
time_step: 5
tasks:
- name: subtract_best_average
  active: false
  from_dir: raw_images
  to_dir: bg_subtracted
  bg_image: "raw_images/image_0025.jpg"
  file_prefix: image
  file_suffix: jpg
  multiply: 2.2
- name: crop_dump
  active: false
  from_dir: bg_subtracted
  to_dir: crop_images
  file_prefix: image
  file_suffix: jpg
  last_file: image_0024.jpg
  file_type: jpg
  y0: 913
  x0: 100
  height: 1666 
  width: 3168
- name: crop_dump
  active: false
  from_dir: bg_subtracted
  to_dir: crop_images2
  file_prefix: image
  file_suffix: jpg
  last_file: image_0024.jpg
  file_type: jpg
  y0: 913
  x0: 100
  height: 1666 
  width: 3168
  rescale: 0.32
- name: paint_lines
  active: true
  from_dir: crop_images2
  to_dir: crop_images3
  file_prefix: image
  file_suffix: jpg
  last_file: image_0024.jpg
  file_type: jpg
  coordinates:
  - "1000 45 400 45 red"
  - "1000 44 400 44 red"
  - "1000 33 400 33 green"
  - "1000 34 400 34 green"
